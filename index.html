    <!-- when added to the home screen the site opens full screen, with no browser bars -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BKC" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Every visit and refresh starts at the lock-screen hero, never at a restored scroll position
      try {
        history.scrollRestoration = 'manual'
        if (location.hash) history.replaceState(null, '', location.pathname + location.search)
        scrollTo(0, 0)
        addEventListener('pageshow', function (e) {
          if (e.persisted) scrollTo(0, 0)
        })
      } catch (e) {}
    </script>
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
